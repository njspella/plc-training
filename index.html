<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLC Tabletop Training Program — Vermeer</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e3a5f'/><text x='50' y='68' font-family='Arial' font-size='50' font-weight='bold' fill='%23e8a820' text-anchor='middle'>PLC</text></svg>">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="top-nav">
    <a class="logo" href="#/" onclick="event.preventDefault();location.hash='#/'">
      <div class="logo-icon">PLC</div>
      <div class="logo-text">PLC Training <span>Vermeer — Advanced Manufacturing</span></div>
    </a>
    <div class="nav-right">
      <div class="progress-badge" id="nav-progress"></div>
      <button class="btn-reset" onclick="if(confirm('Reset all progress? This cannot be undone.')){Progress.resetProgress();App.route();}">Reset Progress</button>
      <button class="hamburger" id="hamburger-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
    </div>
  </nav>

  <!-- Sidebar -->
  <aside class="sidebar hidden" id="sidebar"></aside>

  <!-- Main Content -->
  <main class="main full-width" id="main-content">
    <div style="text-align:center;padding:80px 20px;color:var(--color-text-muted)">Loading...</div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
